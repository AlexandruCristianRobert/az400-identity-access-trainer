<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity &amp; Access Practice Lab</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5d6678; --line:#e1e5ec;
  --accent:#0f6cbd; --accent-soft:#e6f0fa; --ok:#127a3c; --ok-soft:#e5f5eb; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#a35200; --warn-soft:#fdf1e3;
  --code-bg:#0f1720; --code-text:#d6dde8;
  --k:#7cc4ff; --s:#f2b880; --c:#7d8a9c; --d:#d7a6ff; --n:#9fe3a8; --t:#6fd6c9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
    --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
    --warn:#f0b450; --warn-soft:#2b2112;
    --code-bg:#0a0d12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
  --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
  --warn:#f0b450; --warn-soft:#2b2112;
  --code-bg:#0a0d12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:0 8px 4px}
aside .sub{color:var(--muted);font-size:13px;margin:0 8px 14px}
.progress{height:6px;background:var(--line);border-radius:4px;margin:0 8px 6px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{font-size:12px;color:var(--muted);margin:0 8px 14px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--accent-soft)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .num{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
nav button.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.sidefoot{margin:18px 8px 0;display:grid;gap:10px;justify-items:start}
.sidefoot a{font-size:13px;color:var(--accent)}
.theme{font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:32px 40px 80px;max-width:980px;width:100%}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px}
h2{font-size:28px;margin:0 0 8px}
h3{font-size:19px;margin:28px 0 8px}
p{margin:8px 0}
.lead{color:var(--muted);font-size:17px}
:not(pre)>code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em;overflow-wrap:anywhere}
.codewrap{position:relative;margin:12px 0}
pre{background:var(--code-bg);color:var(--code-text);padding:16px 18px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.55;margin:0}
.file{font-size:12px;color:var(--muted);margin:12px 0 -6px;font-family:Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;font-size:12px;background:#ffffff1a;color:#cfd8e3;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.copy:hover{background:#ffffff33}
.tk{color:var(--k)} .ts{color:var(--s)} .tc{color:var(--c);font-style:italic} .td{color:var(--d)} .tn{color:var(--n)} .tt{color:var(--t)}
.tdash{color:var(--c)}
ul.tips,ol.tips{padding-left:20px} .tips li{margin:4px 0}
table.ref{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
table.ref th,table.ref td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.ref th{background:var(--accent-soft);font-weight:600}
.tablewrap{overflow-x:auto}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:15px}
.note.exam{border-left-color:var(--warn);background:var(--warn-soft)}
.exercise{margin-top:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.exercise h3{margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exercise h3 .kind{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px}
.exercise h3 .badge{font-size:12px;background:var(--ok);color:#fff;border-radius:20px;padding:2px 10px;display:none}
.exercise.solved h3 .badge{display:inline-block}
.exercise.solved{border-color:var(--ok)}
textarea{width:100%;min-height:220px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:10px;
  padding:14px;font-size:14px;line-height:1.55;resize:vertical;tab-size:2;outline:none;white-space:pre;overflow:auto}
textarea.short{min-height:120px;white-space:pre-wrap}
textarea:focus{border-color:var(--accent)}
.edhelp{font-size:12px;color:var(--muted);margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:2px 9px;font-size:13px}
.results{list-style:none;padding:0;margin:10px 0}
.results li{padding:6px 12px;border-radius:7px;margin:4px 0;font-size:14px}
.results li.pass{background:var(--ok-soft);color:var(--ok)}
.results li.fail{background:var(--bad-soft);color:var(--bad)}
.results li .sub{display:block;font-size:13px;margin:2px 0 0 18px;opacity:.9}
.hint{display:none;background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:15px;margin:8px 0}
.why{display:none;border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.solution{display:none;margin:10px 0}
.solution .solhead{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
/* choice */
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* order */
.order{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.order li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.order li .pos{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.order li .txt{flex:1}
.order li .mv{display:flex;gap:4px}
.order li.right{border-color:var(--ok);background:var(--ok-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* match */
.match{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
.match td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:middle}
.match td:first-child{width:58%}
.match select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.match tr.right td{background:var(--ok-soft)}
.match tr.wrong td{background:var(--bad-soft)}
/* fill */
.fill{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;line-height:2.3}
.fill.mono{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre-wrap;line-height:2.2}
.fill input{font:inherit;font-size:14px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:90px}
.fill input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* lines */
.lines{background:var(--code-bg);border-radius:10px;padding:8px 0;margin:12px 0;overflow:auto}
.lines .ln{display:flex;gap:12px;padding:2px 14px;cursor:pointer;color:var(--code-text);font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre;border-left:3px solid transparent}
.lines .ln:hover{background:#ffffff12}
.lines .ln .no{color:var(--c);user-select:none;min-width:20px;text-align:right}
.lines .ln.sel{background:#f2b88026;border-left-color:var(--s)}
.lines .ln.right{background:#4cc27a2e;border-left-color:var(--n)}
.lines .ln.wrong{background:#ff7b7230;border-left-color:#ff7b72}
.lines.prose .ln{font-family:inherit;white-space:normal}
.navfoot{display:flex;justify-content:space-between;margin-top:30px}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;height:100vh}
  aside.open{transform:none;box-shadow:0 0 40px #0006}
  main{padding:16px 16px 60px}
  .menu{display:inline-block;margin-bottom:12px}
  h2{font-size:23px}
  .match td{display:block;width:100% !important;border:0;padding:4px 6px}
  .match tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>Identity &amp; Access Lab</h1>
    <p class="sub">AZ-400 · 4.1 Authentication &amp; authorization</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="ptext" id="ptext"></p>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="theme" id="themeBtn">Toggle theme</button>
      <button class="theme" id="resetAllBtn">Reset progress</button>
      <a href="../azure-pipelines-tutorial/index.html">Open the Azure Pipelines Practice Lab</a>
      <a href="../bicep-tutorial/index.html">Open the Bicep Practice Lab</a>
    </div>
  </aside>
  <main>
    <button class="btn menu" id="menuBtn">☰ Modules</button>
    <div id="content"></div>
  </main>
</div>

<script>
/* ===================================================================
   MODULE DATA
   Exercise types (all share: id, title, q, hint, why):
     mc     options[], answer: index
     multi  options[], answer: [indexes]           (select all that apply)
     order  items[] in the CORRECT order (shown shuffled)
     match  rows: [[left html, correct choice]], choices[]
     fill   tpl with [[0]], [[1]]… blanks, blanks: [[accepted…]]  (first = shown in solution)
     lines  code: [lines], answer: [line indexes]  (click the faulty lines)
     text   lang: "yaml" | "text", starter, checks: [{l, t: api => bool}], solution
            yaml → api is the YAML query api (h, item, count, first, src)
            text → api is { src, lines }
   =================================================================== */
const MODULES = [
/* ================================================================ 1 */
{
  group:"Identities for automation",
  title:"Service principals & managed identities",
  tag:"app registration · system-assigned · user-assigned · RBAC",
  intro:`Automation needs an identity in <b>Microsoft Entra ID</b> that Azure RBAC can grant roles to. You have two kinds: a <b>service principal</b> created from an <b>app registration</b>, and a <b>managed identity</b>, a special kind of service principal whose credentials Azure manages for you. The exam asks you to choose between them.`,
  sections:[
    {h:"The options side by side", after:`<div class="tablewrap"><table class="ref">
<tr><th></th><th>Service principal (app registration)</th><th>System-assigned managed identity</th><th>User-assigned managed identity</th></tr>
<tr><td><b>Created as</b></td><td>App registration + its service principal in the tenant</td><td>Turned on for one Azure resource</td><td>A standalone Azure resource (<code>Microsoft.ManagedIdentity/userAssignedIdentities</code>)</td></tr>
<tr><td><b>Lifecycle</b></td><td>Independent, you delete it</td><td>Tied to the resource: deleted with it</td><td>Independent, survives the resources that use it</td></tr>
<tr><td><b>Sharing</b></td><td>Any workload that has its credential</td><td>Only that one resource</td><td>Can be attached to many resources; a resource can have several</td></tr>
<tr><td><b>Credentials</b></td><td>Client secret, certificate, or <b>federated credential</b></td><td>Managed by Azure, nothing to rotate</td><td>Managed by Azure; can also have <b>federated credentials</b></td></tr>
<tr><td><b>Typical use</b></td><td>Workloads outside Azure, multi-tenant apps</td><td>One app that needs access to other Azure services</td><td>Shared identity, roles assigned before the resources exist, self-hosted agents</td></tr>
</table></div>`},
    {h:"How a managed identity is used", lang:"sh", code:`az webapp identity assign --name app-shop --resource-group rg-shop     # system-assigned
az identity create --name id-deploy --resource-group rg-shop           # user-assigned
az role assignment create --assignee <principal-id> \\
   --role "Key Vault Secrets User" --scope <key-vault-resource-id>     # grant access (RBAC)`,
     p:`Code running <b>on</b> the Azure resource asks the platform for a token (for example through <code>DefaultAzureCredential</code> in the Azure SDKs). There is no secret in config, and nothing outside that resource can use the identity directly.`},
    {h:"Least privilege", p:`Whichever identity you choose, give it the <b>narrowest role at the narrowest scope</b>: a data-plane role like <i>Key Vault Secrets User</i> rather than <i>Contributor</i>, scoped to a resource group or resource rather than the subscription. Use <i>Owner</i> or <i>User Access Administrator</i> only when the automation really must create role assignments.`}
  ],
  tip:`"Must not manage any credentials" + "runs on an Azure resource" = <b>managed identity</b>. "Identity deleted with the resource" = <b>system-assigned</b>. "Shared by several resources" or "must exist before the resource / survive redeployments" = <b>user-assigned</b>. Runs <b>outside</b> Azure (GitHub-hosted runner, another cloud, a partner's SaaS) = <b>service principal</b> (ideally with a federated credential, see the next module).`,
  exercises:[
    {id:"sp1", type:"match", title:"Pick the identity",
     q:`Match each requirement to the best identity type.`,
     choices:["Service principal (app registration)","System-assigned managed identity","User-assigned managed identity"],
     rows:[
       ["One Azure Function app must read Key Vault secrets; the identity should disappear when the app is deleted","System-assigned managed identity"],
       ["Ten container apps must share one identity whose role assignments are created before the apps are deployed","User-assigned managed identity"],
       ["A multi-tenant SaaS product from another company needs access to resources in your tenant","Service principal (app registration)"],
       ["An app is deleted and recreated on every blue/green release, but its identity must keep its role assignments","User-assigned managed identity"],
       ["A build server running in another cloud provider must deploy to Azure","Service principal (app registration)"]
     ],
     hint:`Managed identities only work for workloads that run on Azure. Then ask: is the identity tied to one resource, or does it need its own lifecycle?`,
     why:`System-assigned identities live and die with one resource. User-assigned identities are standalone resources, so they can be shared, pre-created and kept across redeployments. Workloads outside Azure (another cloud, a partner's multi-tenant app) need an app registration / service principal.`},
    {id:"sp2", type:"multi", title:"Managed identity facts",
     q:`Which statements are true? <i>Select all that apply.</i>`,
     options:[
       "A system-assigned managed identity is deleted automatically when its Azure resource is deleted",
       "A user-assigned managed identity is a standalone Azure resource that can be attached to several resources",
       "A resource can have one system-assigned identity and, at the same time, several user-assigned identities",
       "You must rotate a managed identity's client secret regularly",
       "A managed identity is a special type of service principal in Microsoft Entra ID",
       "Code on a developer's laptop can request tokens for a VM's system-assigned identity"
     ], answer:[0,1,2,4],
     hint:`Two statements contradict the whole point of managed identities: no credentials to handle, and usable only from the Azure resource.`,
     why:`Managed identities are service principals whose credentials Azure manages, so there's no secret to rotate, and only code running on the resource can get tokens for it. A resource has at most one system-assigned identity but can have several user-assigned ones.`},
    {id:"sp3", type:"mc", title:"Deploying from a GitHub-hosted runner",
     q:`A GitHub Actions workflow on a <b>GitHub-hosted runner</b> deploys to Azure. Security requires that <b>no long-lived secret</b> is stored in GitHub. Which identity setup works?`,
     options:[
       "The system-assigned managed identity of the target web app",
       "An app registration (or a user-assigned managed identity) with a federated credential that trusts the repository",
       "A service principal with a client secret stored as a repository secret",
       "A personal access token of the deployment engineer"
     ], answer:1,
     hint:`A GitHub-hosted runner isn't your Azure resource, so it can't use a managed identity's local token endpoint. What lets it prove who it is without a secret?`,
     why:`The runner is outside Azure, so it can't use a resource's managed identity directly. A <b>federated credential</b> on an app registration or on a user-assigned managed identity lets Entra ID accept the workflow's OIDC token instead of a secret. A client secret works but is exactly the long-lived secret you were told to avoid, and a PAT is a GitHub credential, not an Azure one.`},
    {id:"sp4", type:"fill", title:"Azure CLI: identities and roles", mono:true,
     q:`Complete the commands.`,
     tpl:`az webapp identity [[0]] --name app-shop --resource-group rg-shop        # turn on system-assigned
az [[1]] create --name id-deploy --resource-group rg-shop                # create a user-assigned identity
az role [[2]] create --assignee &lt;principal-id&gt; --role "Key Vault Secrets User" --scope &lt;vault-id&gt;`,
     blanks:[["assign"],["identity"],["assignment"]],
     hint:`Enabling an identity on a resource is an "assign" verb. User-assigned identities have their own command group. RBAC grants are role <i>assignments</i>.`,
     why:`<code>az webapp identity assign</code> (and <code>az vm identity assign</code>, etc.) turns on the system-assigned identity. <code>az identity create</code> creates a user-assigned identity. <code>az role assignment create</code> grants it an RBAC role at a scope.`},
    {id:"sp5", type:"mc", title:"Least privilege for a deployment identity",
     q:`A pipeline identity deploys App Service and Storage resources into the resource group <code>rg-web</code> only. It never creates role assignments. Which role assignment follows least privilege?`,
     options:[
       "Owner on the subscription",
       "Contributor on the subscription",
       "Contributor on the resource group rg-web",
       "User Access Administrator on the resource group rg-web"
     ], answer:2,
     hint:`Smallest scope that still covers the work, and no role-assignment rights it doesn't need.`,
     why:`Contributor can create and manage resources but can't grant access, and scoping it to <code>rg-web</code> keeps the blast radius to that group. Owner and User Access Administrator can create role assignments, which the pipeline doesn't need, and subscription scope is wider than required.`}
  ]
},
/* ================================================================ 2 */
{
  group:"Identities for automation",
  title:"Workload identity federation (OIDC)",
  tag:"federated credentials · azure/login · id-token: write · service connections",
  intro:`<b>Workload identity federation</b> replaces secrets with trust. The CI system (GitHub Actions or Azure Pipelines) issues a short-lived <b>OIDC token</b> describing the workflow run. Microsoft Entra ID checks it against a <b>federated identity credential</b> on an app registration or <b>user-assigned</b> managed identity and, if issuer, subject and audience match, returns an Azure access token. Nothing long-lived is stored anywhere.`,
  sections:[
    {h:"The token exchange", lang:"text", code:`GitHub Actions job  (permissions: id-token: write)
  │ 1 request OIDC token from GitHub's provider
  ▼
OIDC token   iss = https://token.actions.githubusercontent.com
             sub = repo:contoso/shop:environment:production
             aud = api://AzureADTokenExchange
  │ 2 azure/login sends it to Microsoft Entra ID
  ▼
Entra ID: is there a federated credential with this issuer + subject + audience?
  │ 3 yes → short-lived access token for the app / managed identity
  ▼
az / Azure PowerShell / deploy actions run with the identity's RBAC roles`},
    {h:"GitHub Actions: subject claims", p:`The <b>subject</b> in a standard federated credential must match the token exactly (no wildcards). It depends on how the job runs:`,
     lang:"text", code:`Job uses an environment         repo:contoso/shop:environment:production
Push to a branch                repo:contoso/shop:ref:refs/heads/main
Push of a tag                   repo:contoso/shop:ref:refs/tags/v2.0.0
pull_request event              repo:contoso/shop:pull_request`,
     after:`<p>If the job references an <code>environment</code>, the subject is the environment form, even when the run was triggered by a push to <code>main</code>. Audience is <code>api://AzureADTokenExchange</code> (the default for <code>azure/login</code> in the public cloud).</p>`},
    {h:"GitHub Actions: the workflow", file:".github/workflows/deploy.yml", code:`permissions:
  id-token: write      # allow the job to request an OIDC token
  contents: read       # still needed for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: \${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: \${{ secrets.AZURE_TENANT_ID }}
          subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az group list -o table`,
     after:`<p>The three IDs are not secrets in the cryptographic sense, but Microsoft's guidance is to store them as GitHub secrets (environment secrets for protected environments). There is <b>no</b> <code>creds</code> JSON and no client secret.</p>`},
    {h:"Azure Pipelines: WIF service connections", p:`An <b>Azure Resource Manager</b> service connection can use workload identity federation instead of a secret.`,
     lang:"text", code:`Automatic   Azure DevOps creates the app registration, its federated credential
            and a role assignment at the scope you pick (subscription / resource group)
Manual      you create the federated credential yourself on an app registration
            or a user-assigned managed identity, pasting the Issuer and Subject
            identifier that Azure DevOps shows you
Convert     existing secret-based ARM connections can be converted to WIF`,
     after:`<p>Azure DevOps is moving WIF connections in the public cloud from its own issuer to the Microsoft Entra issuer; new connections use the Entra issuer by default, and the UI flags older ones with an <b>Update</b> action. Either way, you copy the values Azure DevOps shows rather than typing them by hand.</p>`}
  ],
  tip:`"No secrets", "no credential rotation", "secretless" → <b>workload identity federation / OIDC</b>. In GitHub Actions, OIDC needs <code>permissions: id-token: write</code> plus <code>azure/login</code> with <code>client-id</code>, <code>tenant-id</code> and <code>subscription-id</code>. Login fails with a subject mismatch? Compare the federated credential's subject with how the job runs (environment vs branch vs pull request).`,
  exercises:[
    {id:"wif1", type:"order", title:"Set up OIDC from GitHub to Azure",
     q:`Put the setup steps in order.`,
     items:[
       "Create an app registration (or a user-assigned managed identity)",
       "Add a federated credential for the repository with the right subject, e.g. environment:production",
       "Assign the identity an Azure RBAC role at the narrowest scope that works",
       "Store the client, tenant and subscription IDs as GitHub secrets",
       "Add permissions: id-token: write and an azure/login step to the workflow"
     ],
     hint:`Identity first, then trust, then authorization in Azure, then the GitHub side.`,
     why:`The identity must exist before it can hold a federated credential. The federated credential establishes trust (who may sign in), the role assignment decides what it may do, and only then does the workflow need the IDs, the <code>id-token: write</code> permission and <code>azure/login</code>.`},
    {id:"wif2", type:"fill", title:"Write the subject claims", mono:true,
     q:`Repository <code>contoso/shop</code>. Fill in the rest of each federated credential subject.`,
     tpl:`Push to the main branch            repo:contoso/shop:[[0]]
Job that uses environment production  repo:contoso/shop:[[1]]
Workflow triggered by pull_request    repo:contoso/shop:[[2]]
Push of the tag v2.0.0                repo:contoso/shop:[[3]]`,
     blanks:[["ref:refs/heads/main"],["environment:production"],["pull_request"],["ref:refs/tags/v2.0.0"]],
     hint:`Branches and tags use the full Git ref after <code>ref:</code>. Environments use <code>environment:</code>. Pull requests have a fixed suffix.`,
     why:`GitHub builds the <code>sub</code> claim as <code>repo:OWNER/REPO:</code> plus the context: <code>ref:refs/heads/BRANCH</code>, <code>ref:refs/tags/TAG</code>, <code>environment:NAME</code> or <code>pull_request</code>. A standard federated credential must match it exactly.`},
    {id:"wif3", type:"text", lang:"yaml", title:"Write the OIDC deploy workflow",
     q:`Write <code>.github/workflows/deploy.yml</code>:
      <ul class="tips">
        <li>runs on a <b>push to main</b></li>
        <li>one job <code>deploy</code> on <code>ubuntu-latest</code> using the environment <code>production</code></li>
        <li>the token may request an OIDC token and read repository contents, nothing else</li>
        <li>steps: <code>actions/checkout</code>, then <code>azure/login</code> using the secrets <code>AZURE_CLIENT_ID</code>, <code>AZURE_TENANT_ID</code>, <code>AZURE_SUBSCRIPTION_ID</code></li>
        <li>no client secret and no <code>creds</code> JSON</li>
      </ul>`,
     starter:`name: deploy
`,
     checks:[
       {l:"Triggered by push to main", t:a => a.h("on.push.branches[]","main") || a.h("on.push.branches","main")},
       {l:"Job deploy runs on ubuntu-latest", t:a => a.h("jobs.deploy.runs-on","ubuntu-latest")},
       {l:"Job uses the production environment", t:a => a.h("jobs.deploy.environment",/^production$/i) || a.h("jobs.deploy.environment.name",/^production$/i)},
       {l:"permissions: id-token: write", t:a => a.h("**permissions.id-token","write")},
       {l:"permissions: contents: read", t:a => a.h("**permissions.contents","read")},
       {l:"No other permissions (and no write-all / read-all)", t:a => !a.h(/^(jobs\.[^.]+\.)?permissions\.(?!id-token$|contents$)[^.]+$/) && !a.h(/^(jobs\.[^.]+\.)?permissions$/, /^(read|write)-all$/)},
       {l:"Checks out the code with actions/checkout", t:a => a.item("jobs.deploy.steps",{uses:/^actions\/checkout@/i})},
       {l:"azure/login with client-id, tenant-id and subscription-id from secrets", t:a => a.item("jobs.deploy.steps",{uses:/^azure\/login@v\d+/i,"with.client-id":/secrets\.AZURE_CLIENT_ID/,"with.tenant-id":/secrets\.AZURE_TENANT_ID/,"with.subscription-id":/secrets\.AZURE_SUBSCRIPTION_ID/})},
       {l:"No creds JSON and no client secret", t:a => !a.h("**with.creds") && !/client[-_]?secret/i.test(a.src)}
     ],
     hint:`<code>permissions</code> can sit at the top level or under the job. Steps are a list; <code>with:</code> lines up with <code>uses:</code>. Secrets are referenced as <code>\${{ secrets.NAME }}</code>.`,
     solution:`name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: \${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: \${{ secrets.AZURE_TENANT_ID }}
          subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}`,
     why:`<code>id-token: write</code> lets the job request the OIDC token; <code>contents: read</code> keeps checkout working, because setting any permission sets every unlisted one to <code>none</code>. <code>azure/login</code> with the three IDs (and no <code>creds</code>) switches to OIDC. Because the job uses <code>environment: production</code>, the federated credential's subject must be <code>repo:OWNER/REPO:environment:production</code>.`},
    {id:"wif4", type:"lines", title:"Spot the errors in the OIDC workflow",
     q:`This workflow is meant to sign in to Azure with OIDC and no secret. Click the <b>two</b> faulty lines.`,
     code:[
       "on:",
       "  push:",
       "    branches: [main]",
       "permissions:",
       "  id-token: read",
       "  contents: read",
       "jobs:",
       "  deploy:",
       "    runs-on: ubuntu-latest",
       "    steps:",
       "      - uses: actions/checkout@v4",
       "      - uses: azure/login@v2",
       "        with:",
       "          client-id: ${{ secrets.AZURE_CLIENT_ID }}",
       "          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}",
       "          tenant-id: ${{ secrets.AZURE_TENANT_ID }}",
       "          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
     ], answer:[4,14],
     hint:`One permission only accepts <code>write</code> or <code>none</code>. And what does "no secret" rule out?`,
     why:`<code>id-token</code> only accepts <code>write</code> or <code>none</code>; requesting an OIDC token needs <code>id-token: write</code>. <code>azure/login</code> has no <code>client-secret</code> input, and adding a secret defeats the purpose: with only <code>client-id</code>, <code>tenant-id</code> and <code>subscription-id</code> it uses OIDC.`},
    {id:"wif5", type:"mc", title:"Why does login fail?",
     q:`A federated credential has subject <code>repo:contoso/shop:ref:refs/heads/main</code>. The workflow runs on a push to <code>main</code>, and the job now has <code>environment: production</code>. <code>azure/login</code> fails with an error that no matching federated identity record was found. What's the fix?`,
     options:[
       "Add id-token: read to the job",
       "Add a federated credential with subject repo:contoso/shop:environment:production",
       "Change the audience to https://token.actions.githubusercontent.com",
       "Use a wildcard subject repo:contoso/shop:*"
     ], answer:1,
     hint:`Once a job references an environment, which form does the subject claim take?`,
     why:`When a job uses an environment, the token's subject becomes <code>repo:contoso/shop:environment:production</code>, which doesn't match the branch-based credential. Add (or switch to) an environment-based federated credential. The audience stays <code>api://AzureADTokenExchange</code>; the GitHub URL is the <i>issuer</i>. Standard federated credentials don't accept wildcards.`},
    {id:"wif6", type:"multi", title:"Federation in Azure Pipelines and Entra ID",
     q:`Which statements are true? <i>Select all that apply.</i>`,
     options:[
       "A WIF service connection stores no secret, so there is nothing to expire or rotate",
       "With the automatic option, Azure DevOps creates the app registration, the federated credential and a role assignment",
       "With the manual option, you add a federated credential using the Issuer and Subject identifier that Azure DevOps displays",
       "Federated credentials can be added to app registrations and to user-assigned managed identities",
       "Federated credentials can be added to system-assigned managed identities",
       "Existing secret-based ARM service connections must be deleted and recreated to use WIF"
     ], answer:[0,1,2,3],
     hint:`Two options are wrong: one about which managed identity type supports federation, one about migrating existing connections.`,
     why:`WIF connections hold no secret. The automatic option creates everything for you; the manual option lets you use your own app registration or user-assigned managed identity. Only <b>user-assigned</b> managed identities support federated credentials, and existing secret-based connections can be <b>converted</b> in place.`}
  ]
},

{
  group:"GitHub",
  title:"GITHUB_TOKEN",
  tag:"automatic token · permissions key · default permissions · limits",
  intro:`At the start of every job GitHub creates a <b><code>GITHUB_TOKEN</code></b>, an installation token for the GitHub Actions app, available as <code>\${{ secrets.GITHUB_TOKEN }}</code> or <code>\${{ github.token }}</code>. You don't create it, and it expires when the job finishes (or at its maximum lifetime, whichever comes first).`,
  sections:[
    {h:"What it can (not) do", lang:"text", code:`Scope        only the repository that contains the workflow
Lifetime     one job
Recursion    events it causes do NOT start new workflow runs
             (except workflow_dispatch and repository_dispatch)
Forks        pull_request runs from forks get a read-only token and no secrets
             (unless an admin enables "Send write tokens to workflows from pull requests")`},
    {h:"Default permissions", p:`Under <b>Settings → Actions → General → Workflow permissions</b> (repository, organization or enterprise) choose <i>Read and write permissions</i> or the restricted <i>Read repository contents and packages permissions</i>. Restricted is the safer default; workflows then ask for more with the <code>permissions</code> key. The same page has <i>Allow GitHub Actions to create and approve pull requests</i>.`},
    {h:"The permissions key", code:`permissions:            # workflow level: applies to every job
  contents: read

jobs:
  comment:
    permissions:        # job level: replaces the workflow-level block for this job
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR" --body "Thanks!"
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          PR: \${{ github.event.pull_request.html_url }}`,
     after:`<p>Values are <code>read</code>, <code>write</code> or <code>none</code> (<code>id-token</code> only takes <code>write</code> or <code>none</code>). <b>As soon as you list any permission, every permission you don't list becomes <code>none</code>.</b> Shorthands: <code>permissions: read-all</code>, <code>permissions: write-all</code>, and <code>permissions: {}</code> to disable everything.</p>
<div class="tablewrap"><table class="ref">
<tr><th>Task</th><th>Permission</th></tr>
<tr><td>Check out code / read files</td><td><code>contents: read</code></td></tr>
<tr><td>Push commits, create releases</td><td><code>contents: write</code></td></tr>
<tr><td>Comment on or label pull requests</td><td><code>pull-requests: write</code></td></tr>
<tr><td>Create or edit issues</td><td><code>issues: write</code></td></tr>
<tr><td>Publish to GitHub Packages / GHCR</td><td><code>packages: write</code></td></tr>
<tr><td>Upload code scanning (SARIF) results</td><td><code>security-events: write</code></td></tr>
<tr><td>Request an OIDC token</td><td><code>id-token: write</code></td></tr>
<tr><td>Set commit statuses</td><td><code>statuses: write</code></td></tr>
</table></div>`}
  ],
  tip:`"Least privilege for the workflow token" → set the default to <b>read</b> and grant per job with <code>permissions</code>. "A commit pushed by the workflow doesn't trigger CI" → that's by design for <code>GITHUB_TOKEN</code>; use a <b>GitHub App installation token</b> (or a PAT) if you need it. "Access another repository" → <code>GITHUB_TOKEN</code> can't; use a GitHub App.`,
  exercises:[
    {id:"gt1", type:"multi", title:"GITHUB_TOKEN facts",
     q:`Which statements about <code>GITHUB_TOKEN</code> are true? <i>Select all that apply.</i>`,
     options:[
       "A new token is created for each job and expires when the job finishes (or at its maximum lifetime)",
       "Its access is limited to the repository that contains the workflow",
       "Once you list any permission under permissions, all unlisted permissions are set to none",
       "Commits pushed with GITHUB_TOKEN trigger push workflows like any other push",
       "You must create it as a repository secret before workflows can use it",
       "It can clone other private repositories in the same organization if the organization allows it"
     ], answer:[0,1,2],
     hint:`It's automatic, per job, per repository, and deliberately doesn't start new runs.`,
     why:`The token is created automatically per job and scoped to the workflow's own repository. Events it causes don't start new workflow runs (to prevent recursion), apart from <code>workflow_dispatch</code> and <code>repository_dispatch</code>. Other repositories need a GitHub App token or a PAT.`},
    {id:"gt2", type:"text", lang:"yaml", title:"Least-privilege comment job",
     q:`Write a workflow that comments on pull requests:
      <ul class="tips">
        <li>triggered by <code>pull_request</code></li>
        <li>job <code>comment</code> on <code>ubuntu-latest</code> whose token can <b>read contents</b> and <b>write pull requests</b> and nothing else</li>
        <li>a step that runs <code>gh pr comment</code> with the environment variable <code>GH_TOKEN</code> set to the workflow token</li>
      </ul>`,
     starter:`name: pr-comment
`,
     checks:[
       {l:"Triggered by pull_request", t:a => a.h("on","pull_request") || a.h("on[]","pull_request") || a.h("on.pull_request")},
       {l:"Job comment runs on ubuntu-latest", t:a => a.h("jobs.comment.runs-on","ubuntu-latest")},
       {l:"contents: read", t:a => a.h("**permissions.contents","read")},
       {l:"pull-requests: write", t:a => a.h("**permissions.pull-requests","write")},
       {l:"No other permissions (and no write-all / read-all)", t:a => !a.h(/^(jobs\.[^.]+\.)?permissions\.(?!contents$|pull-requests$)[^.]+$/) && !a.h(/^(jobs\.[^.]+\.)?permissions$/, /^(read|write)-all$/)},
       {l:"A step runs gh pr comment", t:a => a.item("jobs.comment.steps",{run:/gh\s+pr\s+comment/})},
       {l:"GH_TOKEN is the workflow token", t:a => a.h("**env.GH_TOKEN",/\$\{\{\s*(secrets\.GITHUB_TOKEN|github\.token)\s*\}\}/)}
     ],
     hint:`Put <code>permissions</code> under the job (or the workflow). Use <code>\${{ secrets.GITHUB_TOKEN }}</code> or <code>\${{ github.token }}</code>.`,
     solution:`name: pr-comment
on: pull_request

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - run: gh pr comment "$PR" --body "Thanks for the contribution!"
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          PR: \${{ github.event.pull_request.html_url }}`,
     why:`Listing exactly <code>contents: read</code> and <code>pull-requests: write</code> sets everything else to <code>none</code>. The GitHub CLI reads its token from <code>GH_TOKEN</code>. Note that for pull requests from forks the token is read-only anyway, so the comment would fail there unless the repo is configured otherwise.`},
    {id:"gt3", type:"mc", title:"The commit that never triggered CI",
     q:`A workflow formats code and pushes the result back to the pull request branch using <code>GITHUB_TOKEN</code>. The required CI checks never run for that new commit, so the PR can't be merged. What's the recommended fix?`,
     options:[
       "Give the job permissions: write-all",
       "Push with an installation token from a GitHub App instead of GITHUB_TOKEN",
       "Re-run the formatting workflow with workflow_run",
       "Turn on Allow GitHub Actions to create and approve pull requests"
     ], answer:1,
     hint:`More permissions won't change the anti-recursion rule. Which other credential acts as its own identity and does trigger workflows?`,
     why:`Events caused by <code>GITHUB_TOKEN</code> deliberately don't start new workflow runs. A GitHub App installation token (for example created with <code>actions/create-github-app-token</code>) does trigger them, is scoped to chosen repos and permissions, and isn't tied to a person. A PAT would also work but is tied to a user account.`},
    {id:"gt4", type:"lines", title:"Spot the invalid permissions",
     q:`Click the <b>three</b> lines that are invalid or wrong.`,
     code:[
       "permissions:",
       "  contents: write-all",
       "  pull-request: write",
       "  issues: read",
       "  id-token: read",
       "  packages: none",
       "  statuses: write"
     ], answer:[1,2,4],
     hint:`Check each value against read / write / none, each key against the real permission names, and remember which key is special.`,
     why:`<code>write-all</code> is only valid as a shorthand for the whole block (<code>permissions: write-all</code>), not as a value for one scope. The key is <code>pull-requests</code> (plural). <code>id-token</code> only accepts <code>write</code> or <code>none</code>.`},
    {id:"gt5", type:"match", title:"Which permission does the job need?",
     q:`Match each task to the permission the <code>GITHUB_TOKEN</code> needs.`,
     choices:["contents: write","pull-requests: write","issues: write","packages: write","security-events: write","id-token: write"],
     rows:[
       ["Create a GitHub release with gh release create","contents: write"],
       ["Post a review comment on the pull request","pull-requests: write"],
       ["Open an issue when a nightly job fails","issues: write"],
       ["Push a container image to ghcr.io","packages: write"],
       ["Upload CodeQL SARIF results","security-events: write"],
       ["Sign in to Azure with azure/login and OIDC","id-token: write"]
     ],
     hint:`Releases and tags live with the repository contents. Code scanning results are "security events".`,
     why:`Releases and pushes need <code>contents: write</code>; PR comments need <code>pull-requests: write</code>; new issues need <code>issues: write</code>; GHCR needs <code>packages: write</code>; SARIF uploads need <code>security-events: write</code>; OIDC needs <code>id-token: write</code>.`},
    {id:"gt6", type:"mc", title:"Organization-wide default",
     q:`Your organization has 300 repositories. Security wants every workflow token to be <b>read-only by default</b>, with write access granted only where a workflow explicitly asks for it. What do you do?`,
     options:[
       "Add permissions: read-all to every workflow file by hand",
       "Set the organization's Workflow permissions to Read repository contents and packages permissions; workflows request more with the permissions key",
       "Disable GitHub Actions for the organization",
       "Require all workflows to use a PAT instead of GITHUB_TOKEN"
     ], answer:1,
     hint:`There's a single setting for the default, and a per-workflow key for exceptions.`,
     why:`The restricted default at organization (or enterprise) level applies to every repo at once. Individual workflows and jobs then use <code>permissions</code> to ask for exactly what they need. Editing 300 files is error-prone, and PATs would be a step backwards.`}
  ]

{
  group:"GitHub",
  title:"GitHub Apps, PATs & deploy keys",
  tag:"installation tokens · fine-grained vs classic · SSO · deploy keys",
  intro:`When automation needs more than <code>GITHUB_TOKEN</code> (other repositories, triggering workflows, long-running integrations), choose between a <b>GitHub App</b>, an <b>OAuth app</b>, a <b>personal access token</b> or a <b>deploy key</b>. GitHub recommends GitHub Apps for integrations and automation.`,
  sections:[
    {h:"Comparison", after:`<div class="tablewrap"><table class="ref">
<tr><th>Credential</th><th>Acts as</th><th>Access</th><th>Notes</th></tr>
<tr><td><b>GitHub App</b></td><td>Itself (a bot), or a user via user access tokens</td><td>Fine-grained permissions, only on repos where it's installed</td><td>Installation tokens expire after <b>1 hour</b>; not tied to a person; rate limits scale with the installation</td></tr>
<tr><td><b>OAuth app</b></td><td>The signed-in user</td><td>Broad OAuth scopes, everything the user can reach</td><td>Older model; prefer GitHub Apps</td></tr>
<tr><td><b>Fine-grained PAT</b></td><td>The user</td><td>One resource owner (user or org), selected repos, granular permissions</td><td>Expiry; org can require approval</td></tr>
<tr><td><b>Classic PAT</b></td><td>The user</td><td>Scopes such as <code>repo</code>, <code>workflow</code>, <code>read:org</code>, across all repos the user can access</td><td>Org can restrict classic PAT access; needs SSO authorization for SAML orgs</td></tr>
<tr><td><b>Deploy key</b></td><td>No user</td><td>One SSH key for <b>one</b> repository, read-only unless write is allowed</td><td>Good for a server that only pulls one repo</td></tr>
</table></div>`},
    {h:"GitHub App authentication flow", lang:"text", code:`1 App is registered with permissions and a private key
2 App is installed on an org/user account for all or selected repositories
3 App signs a JWT with its private key
4 JWT is exchanged for an installation access token (valid 1 hour)
5 API calls / git operations use the installation token`,
     after:`<p>In GitHub Actions, the <code>actions/create-github-app-token</code> action performs steps 3 and 4 from the app ID and private key you store as secrets.</p>`},
    {h:"PATs and SAML single sign-on", p:`If an organization enforces SAML SSO, a <b>classic PAT</b> or SSH key must be <b>authorized for that organization</b> (Configure SSO on the token) before it can access its resources. Organization owners can also <b>restrict classic PATs</b> and <b>require approval for fine-grained PATs</b>, and can review and revoke the fine-grained tokens that access the org.`}
  ],
  tip:`"Must keep working when the employee who set it up leaves", "fine-grained permissions", "short-lived tokens", "higher rate limits" → <b>GitHub App</b>. "A server must pull one repo over SSH, read-only" → <b>deploy key</b>. "403 with a valid classic PAT on an org with SAML" → <b>authorize the PAT for SSO</b>.`,
  exercises:[
    {id:"ga1", type:"match", title:"Name the credential",
     q:`Match each description to the credential type.`,
     choices:["GitHub App","OAuth app","Fine-grained PAT","Classic PAT","Deploy key"],
     rows:[
       ["Installed on selected repositories; mints installation tokens that expire after one hour","GitHub App"],
       ["Acts on behalf of whoever signs in through the browser, with broad scopes","OAuth app"],
       ["Belongs to one user, limited to one resource owner and selected repositories with granular permissions","Fine-grained PAT"],
       ["Scopes like repo and workflow that apply to every repository the user can access","Classic PAT"],
       ["An SSH public key attached to a single repository, read-only unless write access is allowed","Deploy key"]
     ],
     hint:`Who does it act as (app, user, nobody), and how wide is its reach?`,
     why:`GitHub Apps act as themselves with fine-grained, installation-scoped, short-lived tokens. OAuth apps and PATs act as a user; classic PATs are broad, fine-grained PATs are narrowed to one owner and chosen repos. Deploy keys are per-repository SSH keys with no user behind them.`},
    {id:"ga2", type:"order", title:"GitHub App token flow",
     q:`Put the GitHub App authentication steps in order.`,
     items:[
       "Register the app with the permissions it needs and generate a private key",
       "Install the app on the organization for the selected repositories",
       "Sign a JSON Web Token (JWT) with the app's private key",
       "Exchange the JWT for an installation access token",
       "Call the API or push with the installation token until it expires after one hour"
     ],
     hint:`Registration and installation happen once; the JWT is the app proving who it is; the installation token is what does the work.`,
     why:`The private key never leaves your side: it signs a short JWT that identifies the app. GitHub exchanges that for an installation token limited to the installation's repositories and the app's permissions, and that token expires after one hour, so automation requests a new one each run.`},
    {id:"ga3", type:"mc", title:"Org-wide automation bot",
     q:`A release bot must open pull requests in 25 repositories of your organization. It must keep working when the engineer who built it leaves, use only the permissions it needs, and avoid long-lived tokens. Which credential should it use?`,
     options:[
       "A classic PAT of the engineer with the repo scope",
       "A fine-grained PAT of a shared 'bot' user account",
       "A GitHub App installed on those 25 repositories",
       "A deploy key in each repository"
     ], answer:2,
     hint:`Which option isn't tied to any person and only produces short-lived tokens?`,
     why:`A GitHub App is owned by the organization, has fine-grained permissions, is installed only on chosen repos and issues one-hour installation tokens. PATs are tied to a user (and a shared "bot" account is a licence and secret-management burden). Deploy keys only give Git access to one repo each and can't open pull requests.`},
    {id:"ga4", type:"multi", title:"Fine-grained vs classic PATs",
     q:`Which statements are true? <i>Select all that apply.</i>`,
     options:[
       "Fine-grained PATs can be limited to specific repositories of one resource owner",
       "Organization owners can require approval before a fine-grained PAT can access the organization",
       "Organization owners can restrict access by classic PATs to the organization",
       "Classic PATs can be limited to a single repository",
       "Pushing changes to workflow files with a classic PAT needs the workflow scope",
       "A PAT acts as its own bot identity, separate from the user who created it"
     ], answer:[0,1,2,4],
     hint:`Classic tokens use scopes that span every repo the user can reach. Every PAT acts as its owner.`,
     why:`Fine-grained PATs target one owner and selected repos with granular permissions, and orgs can require approval for them or block classic PATs. Classic PATs can't be restricted to a repository, and need the <code>workflow</code> scope to change files under <code>.github/workflows</code>. Any PAT acts as the user who created it.`},

       "Switch to a deploy key"
     ], answer:1,
     hint:`With SAML SSO, tokens need an extra step per organization.`,

  intro:`Access to organization repositories is the sum of the organization's <b>base permission</b>, the <b>teams</b> a person belongs to, and any <b>direct</b> repository role. The highest grant wins. Design access around teams, not individuals.`,

    {h:"Organization-level roles", after:`<div class="tablewrap"><table class="ref">
<tr><th>Role</th><th>What it's for</th></tr>
<tr><td><b>Owner</b></td><td>Full administrative access to the organization</td></tr>
<tr><td><b>Member</b></td><td>Default role; gets the base permission plus team and direct grants</td></tr>
<tr><td><b>Billing manager</b></td><td>Manage billing settings only</td></tr>
<tr><td><b>Security manager</b></td><td>Manage security alerts and settings across the organization, read access to all repositories</td></tr>
<tr><td><b>Moderator</b></td><td>Block/unblock non-members, hide comments, manage interaction limits</td></tr>
<tr><td><b>Outside collaborator</b></td><td>Not a member; has access only to the repositories they're added to</td></tr>
</table></div>`},
    {h:"Teams and base permissions", p:`<b>Base permissions</b> (No permission, Read, Write, Admin) apply to every member on every repository. <b>Teams</b> grant repository roles to groups; a <b>child team inherits</b> the access of its parent team. Teams can be <i>visible</i> or <i>secret</i>; only visible teams can be nested. Outside collaborators can't join teams.`}
  ],
  tip:`"Manage issues and PRs but must not push" = <b>Triage</b>. "Manage the repo but not delete it or change security/access" = <b>Maintain</b>. "Contractor needs one repo, shouldn't be an org member" = <b>outside collaborator</b>. "Everyone should be able to read all repos" = <b>base permission: Read</b>. Need a role between the built-in ones = <b>custom repository role</b>.`,

     hint:`Triage sits between reading and pushing; Maintain sits between pushing and full control.`,
     why:`Read → Triage (manage issues/PRs) → Write (push, merge) → Maintain (manage the repo without destructive or sensitive actions) → Admin (everything, including access and deletion).`},

  intro:`A <b>service connection</b> stores how Azure Pipelines authenticates to an external service: Azure, a container registry, a Kubernetes cluster, GitHub, a package feed. It's a <b>protected resource</b>: you control who can manage it, which pipelines and projects may use it, and which checks must pass before a stage can use it.`,

Kubernetes               a cluster (kubeconfig, service account, or Azure subscription)
GitHub                   GitHub repositories (GitHub App, OAuth or PAT)
NuGet / npm / Maven      authenticated external package feeds
SSH                      run commands or copy files on a remote host
Generic                  any server with URL + credentials`},

<tr><th>Layer</th><th>Setting</th></tr>
<tr><td><b>User roles</b></td><td><b>Reader</b> (view), <b>User</b> (use in pipelines), <b>Creator</b> (create connections; project level only), <b>Administrator</b> (use and manage roles). The creator becomes Administrator.</td></tr>

  intro:`An Azure DevOps <b>personal access token</b> (PAT) is a password-like token that acts as <b>you</b>. Create it under <b>User settings → Personal access tokens</b>, pick the organization, an expiry date and scopes. Microsoft now recommends <b>Microsoft Entra tokens</b> (and service principals / managed identities) over PATs wherever possible.`,

Scopes         Custom defined, e.g. Code (Read), Work Items (Read & write)
               instead of Full access
Storage        a secret store (Key Vault, secret variable), never in source code
Revoke         User settings → Personal access tokens → Revoke, as soon as it's not needed`},
    {h:"Policies for administrators", after:`<div class="tablewrap"><table class="ref">
<tr><th>Policy</th><th>Level / who</th><th>Effect</th></tr>
<tr><td><b>Restrict global personal access token creation</b></td><td>Tenant, Azure DevOps Administrator</td><td>New PATs must target specific organizations</td></tr>
<tr><td><b>Restrict full-scoped personal access token creation</b></td><td>Tenant, Azure DevOps Administrator</td><td>New PATs must use custom scopes</td></tr>
<tr><td><b>Enforce maximum personal access token lifespan</b></td><td>Tenant, Azure DevOps Administrator</td><td>Caps new PATs to N days</td></tr>
<tr><td><b>Automatically revoke leaked personal access tokens</b></td><td>Tenant, Azure DevOps Administrator</td><td>On by default: PATs found in public GitHub repos are revoked</td></tr>
<tr><td><b>Restrict personal access token (PAT) creation</b></td><td>Organization, Project Collection Administrator</td><td>Only allowlisted users/groups can create PATs (optionally packaging-only PATs for everyone)</td></tr>
</table></div>
<p>Tenant policies live under <b>Organization settings → Microsoft Entra</b>; the organization policy under <b>Organization settings → Policies</b>. Each policy has its own allowlist of Entra users or groups. Existing PATs stay valid until they expire.</p>`},

{
  group:"Azure DevOps",
  title:"Security groups & permissions",
  tag:"organization · project · object levels · allow, deny, inheritance",
  intro:`Azure DevOps permissions are granted to <b>security groups</b> at three levels: <b>organization</b> (collection), <b>project</b> and <b>object</b> (repository, branch, pipeline, area path, query folder…). Members inherit their groups' permissions, and objects inherit from their parents.`,
  sections:[
    {h:"Default groups", lang:"text", code:`Organization level                        Project level
  Project Collection Administrators         Project Administrators
  Project Collection Build Administrators   Build Administrators
  Project Collection Valid Users            Contributors
  Project-scoped Users                      Readers
  Project Collection Build Service Accounts Release Administrators
  … other service account groups            Project Valid Users
                                            [Team name] Team  (one per team)`,
     after:`<p>Most people go into <b>Contributors</b> with <b>Basic</b> access. <b>Valid Users</b> groups fill automatically with everyone added to any group at that level; don't change their default permissions. Groups can contain users, other groups and <b>Microsoft Entra groups</b>; Entra membership changes are picked up within about an hour.</p>`},
    {h:"Permission states", lang:"text", code:`Allow / Allow (inherited) / Allow (system)     → has the permission
Deny  / Deny  (inherited) / Deny  (system)     → doesn't have it
Not set                                        → neither; other assignments decide.
                                                 Nothing allows it → no permission`},
    {h:"How they combine", after:`<ul class="tips">
<li><b>Groups at the same scope:</b> a user gets the union of their groups; a <b>Deny generally wins over an Allow</b> from another group.</li>
<li><b>Object hierarchy:</b> permissions flow down (e.g. area <code>Web</code> → <code>Web\\Checkout</code>) unless explicitly set on the child. An <b>explicit Allow on the child overrides an inherited Deny</b> from the parent for that identity.</li>
<li><b>Not set</b> never overrides anything.</li>
<li>Use <b>Why?</b> next to a permission to trace where it comes from.</li>
</ul>`},
    {h:"Limiting visibility", p:`By default, organization members can see other projects' names and users. The preview feature <b>Limit user visibility and collaboration to specific projects</b> confines members of the <b>Project-scoped Users</b> group (for example Stakeholders or Entra guests) to the projects they're explicitly added to, in the web portal.`}
  ],
  tip:`Same scope, conflicting groups → <b>Deny wins</b>. Parent Deny vs. explicit child Allow → <b>child Allow wins</b>. "Not set" → no access unless something else allows it. Manage membership with <b>Entra groups</b> inside Azure DevOps groups; don't assign permissions to individuals.`,
  exercises:[
    {id:"az1", type:"match", title:"Which default group?",

       ["Read and write access to code, work items and pipelines in a project","Contributors"],
       ["View-only access to project resources","Readers"],
       ["Manages build pipelines and their resources in a project","Build Administrators"],
       ["Automatically contains everyone added to any organization-level group","Project Collection Valid Users"]
     ],
     hint:`"Project Collection" = organization level. "Valid Users" groups fill themselves.`,
     why:`Project Collection Administrators own the organization; Project Administrators own one project; Contributors and Readers are the everyday read-write and read-only groups; Build Administrators manage build pipelines; Valid Users groups are populated automatically.`},
    {id:"az2", type:"mc", title:"Allow in one group, Deny in another",
     q:`Sam is in <b>Contributors</b>, which has <i>Contribute</i> = Allow on repository <code>payments</code>. He's also in the custom group <b>Contractors</b>, which has <i>Contribute</i> = Deny on the same repository. Can Sam push to <code>payments</code>?`,
